<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>People Counter + Gender</title>
  <style>
    :root {
      --bg: #0b0d10; --accent: #00e676; --blue: #00b0ff; --pink: #ff80ab;
      --text: #eef0f4; --muted: #8b93a7; --danger: #ff5252; --border: #2a3140;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { position: relative; width: 100%; height: 100%; }
    #viewport { position: relative; width: 100%; height: 100%; background: #000; }
    #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #canvas { pointer-events: none; }

    #top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    }
    #status { font-size: 12px; color: var(--muted); }
    #status.ready { color: var(--accent); }
    #status.error { color: var(--danger); }
    #status.running { color: #ffd740; }

    #stats {
      position: absolute; top: 48px; left: 8px; right: 8px; z-index: 10;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .stat {
      background: rgba(0,0,0,0.7); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 10px; flex: 1; min-width: 70px;
    }
    .stat-label { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
    .stat-value { font-size: 18px; font-weight: 700; }
    .blue { color: var(--blue); }
    .pink { color: var(--pink); }
    .green { color: var(--accent); }

    #big {
      position: absolute; bottom: 145px; left: 0; right: 0; text-align: center;
      z-index: 5; pointer-events: none; text-shadow: 0 2px 14px #000;
    }
    #big-num { font-size: clamp(48px, 18vw, 88px); font-weight: 800; color: var(--accent); line-height: 1; }
    #big-label { font-size: 12px; letter-spacing: 1.2px; color: rgba(255,255,255,0.7); text-transform: uppercase; }
    #big-gender { margin-top: 4px; font-size: 14px; }

    #controls {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 14px; padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.88), transparent);
      display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    .btn-row { display: flex; gap: 10px; width: 100%; max-width: 420px; }
    button {
      flex: 1; border: none; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 600;
    }
    button:disabled { opacity: 0.4; }
    #startBtn { background: var(--accent); color: #000; }
    #stopBtn { background: var(--danger); color: #fff; }
    #switchBtn { background: #1a1d24; color: #fff; border: 1px solid var(--border); flex: 0 0 50px; }
    #info { font-size: 11px; color: var(--muted); text-align: center; }

    #result {
      display: none; position: absolute; inset: 0; z-index: 30;
      background: rgba(11,13,16,0.95); flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    #result.visible { display: flex; }
    #result h2 { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
    #final-total { font-size: clamp(52px, 20vw, 100px); font-weight: 800; color: var(--accent); }
    #final-genders { display: flex; gap: 20px; margin: 14px 0 18px; }
    #final-genders .num { font-size: 26px; font-weight: 700; }
    #final-genders .lab { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    #resetBtn { background: var(--accent); color: #000; max-width: 200px; padding: 14px 24px; border: none; border-radius: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="canvas"></canvas>
      <div id="top-bar"><div id="status">Ready — tap Start</div></div>

      <div id="stats">
        <div class="stat"><div class="stat-label">In Frame</div><div class="stat-value blue" id="current">0</div></div>
        <div class="stat"><div class="stat-label">Men</div><div class="stat-value blue" id="men">0</div></div>
        <div class="stat"><div class="stat-label">Women</div><div class="stat-value pink" id="women">0</div></div>
        <div class="stat"><div class="stat-label">Unique</div><div class="stat-value green" id="unique">0</div></div>
      </div>

      <div id="big">
        <div id="big-num">0</div>
        <div id="big-label">unique people</div>
        <div id="big-gender"><span id="sum-men">0 men</span> · <span id="sum-women">0 women</span></div>
      </div>
    </div>

    <div id="controls">
      <div class="btn-row">
        <button id="startBtn">Start Camera</button>
        <button id="switchBtn" disabled>🔄</button>
        <button id="stopBtn" disabled>Stop & Total</button>
      </div>
      <div id="info">All processing stays on your device</div>
    </div>

    <div id="result">
      <h2>Final Unique Count</h2>
      <div id="final-total">0</div>
      <div id="final-genders">
        <div><div class="num blue" id="final-men">0</div><div class="lab">Men</div></div>
        <div><div class="num pink" id="final-women">0</div><div class="lab">Women</div></div>
        <div><div class="num" id="final-unknown">0</div><div class="lab">Unknown</div></div>
      </div>
      <button id="resetBtn">Count Again</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <script>
    // ========== Simple Person Tracker ==========
    class Tracker {
      constructor() {
        this.nextId = 1;
        this.tracks = [];
        this.maxAge = 14;
        this.minHits = 2;
        this.confirmed = new Set();
        this.unique = 0;
        this.men = 0;
        this.women = 0;
        this.unknown = 0;
      }

      iou(a, b) {
        const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
        const x2 = Math.min(a[0]+a[2], b[0]+b[2]), y2 = Math.min(a[1]+a[3], b[1]+b[3]);
        const inter = Math.max(0, x2-x1) * Math.max(0, y2-y1);
        return inter / (a[2]*a[3] + b[2]*b[3] - inter + 1e-6);
      }

      centroid(b) { return [b[0]+b[2]/2, b[1]+b[3]/2]; }

      update(dets, w, h) {
        const diag = Math.hypot(w, h) || 1;
        const matchedT = new Set(), matchedD = new Set();

        // greedy match
        const pairs = [];
        for (let t = 0; t < this.tracks.length; t++) {
          for (let d = 0; d < dets.length; d++) {
            const iou = this.iou(this.tracks[t].bbox, dets[d]);
            const c1 = this.tracks[t].centroid, c2 = this.centroid(dets[d]);
            const dist = Math.hypot(c1[0]-c2[0], c1[1]-c2[1]) / diag;
            pairs.push({ t, d, score: iou*2 - dist });
          }
        }
        pairs.sort((a,b) => b.score - a.score);

        for (const p of pairs) {
          if (matchedT.has(p.t) || matchedD.has(p.d) || p.score < 0.15) continue;
          matchedT.add(p.t); matchedD.add(p.d);
          const tr = this.tracks[p.t];
          tr.bbox = dets[p.d];
          tr.centroid = this.centroid(dets[p.d]);
          tr.timeSinceUpdate = 0;
          tr.hits++;
          if (tr.hits >= this.minHits && !this.confirmed.has(tr.id)) {
            this.confirmed.add(tr.id);
            this.unique++;
            this.unknown++;
          }
        }

        // new tracks
        for (let d = 0; d < dets.length; d++) {
          if (matchedD.has(d)) continue;
          this.tracks.push({
            id: this.nextId++,
            bbox: dets[d],
            centroid: this.centroid(dets[d]),
            hits: 1,
            timeSinceUpdate: 0,
            gender: null
          });
        }

        // age out
        this.tracks = this.tracks.filter(tr => {
          if (!matchedT.has(this.tracks.indexOf(tr))) tr.timeSinceUpdate++;
          return tr.timeSinceUpdate <= this.maxAge;
        });

        return this.tracks.filter(tr => tr.hits >= this.minHits || tr.timeSinceUpdate === 0);
      }

      setGender(id, gender) {
        const tr = this.tracks.find(t => t.id === id);
        if (!tr || tr.gender) return false;
        tr.gender = gender;
        if (this.confirmed.has(id)) {
          this.unknown = Math.max(0, this.unknown - 1);
          if (gender === 'male') this.men++;
          else this.women++;
        }
        return true;
      }

      reset() {
        this.nextId = 1; this.tracks = []; this.confirmed.clear();
        this.unique = this.men = this.women = this.unknown = 0;
      }
    }

    // ========== App ==========
    let personModel = null, faceReady = false, stream = null, running = false;
    let timer = null, preferEnv = true, genderBusy = false, tick = 0;
    const tracker = new Tracker();

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);

    function status(msg, cls = '') {
      $('status').textContent = msg;
      $('status').className = cls;
    }

    function updateUI() {
      $('current').textContent = tracker.tracks.filter(t => t.hits >= 2 || t.timeSinceUpdate === 0).length;
      $('men').textContent = tracker.men;
      $('women').textContent = tracker.women;
      $('unique').textContent = tracker.unique;
      $('big-num').textContent = tracker.unique;
      $('sum-men').textContent = tracker.men + ' men';
      $('sum-women').textContent = tracker.women + ' women';
    }

    async function loadModels() {
      status('Loading person model…', 'running');
      personModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

      status('Loading face + gender models…', 'running');
      const MODEL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);
      await faceapi.nets.ageGenderNet.loadFromUri(MODEL);
      faceReady = true;
      status('Models ready — starting camera', 'ready');
    }

    async function startCam() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: preferEnv ? { ideal: 'environment' } : { ideal: 'user' },
            width: { ideal: 1280 }, height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();
        await new Promise(r => video.videoWidth ? r() : (video.onloadedmetadata = r));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        return true;
      } catch (e) {
        status('Camera error: ' + (e.name || 'denied'), 'error');
        return false;
      }
    }

    // Gender: run full-frame face detection and match to tracks loosely
    async function estimateGender(active) {
      if (!faceReady || genderBusy || !running || active.length === 0) return;
      genderBusy = true;
      try {
        const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.25 });
        const faces = await faceapi.detectAllFaces(video, opts).withAgeAndGender();

        for (const f of faces) {
          if (!f.gender || f.genderProbability < 0.50) continue;
          const box = f.detection.box;
          const fx = box.x + box.width / 2;
          const fy = box.y + box.height / 2;

          // find closest track that still has no gender
          let best = null, bestDist = Infinity;
          for (const tr of active) {
            if (tr.gender) continue;
            const [px, py, pw, ph] = tr.bbox;
            const cx = px + pw / 2;
            const cy = py + ph * 0.25; // upper body / head area
            const dist = Math.hypot(fx - cx, fy - cy);
            if (dist < bestDist && dist < Math.max(pw, ph) * 0.9) {
              bestDist = dist;
              best = tr;
            }
          }

          if (best) {
            const g = f.gender === 'male' ? 'male' : 'female';
            if (tracker.setGender(best.id, g)) {
              updateUI();
              status(`Gender assigned: ${g} (ID ${best.id})`, 'running');
            }
          }
        }
      } catch (e) {
        console.warn('Gender error', e);
      } finally {
        genderBusy = false;
      }
    }

    async function loop() {
      if (!running || !personModel || video.readyState < 2) return;
      try {
        const preds = await personModel.detect(video);
        const boxes = preds.filter(p => p.class === 'person' && p.score > 0.45).map(p => p.bbox);
        const active = tracker.update(boxes, canvas.width, canvas.height);

        updateUI();

        // draw
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const lw = Math.max(2, canvas.width / 320);
        active.forEach(tr => {
          const [x, y, w, h] = tr.bbox;
          let col = '#00e676';
          if (tr.gender === 'male') col = '#00b0ff';
          if (tr.gender === 'female') col = '#ff80ab';
          ctx.strokeStyle = col;
          ctx.lineWidth = lw;
          ctx.strokeRect(x, y, w, h);
          const label = `ID ${tr.id}` + (tr.gender === 'male' ? ' ♂' : tr.gender === 'female' ? ' ♀' : '');
          ctx.font = `bold ${Math.max(12, canvas.width/38)}px sans-serif`;
          const tw = ctx.measureText(label).width;
          ctx.fillStyle = col;
          ctx.fillRect(x, y - 20, tw + 8, 20);
          ctx.fillStyle = '#000';
          ctx.fillText(label, x + 4, y - 5);
        });

        // run gender every 2nd cycle
        tick++;
        if (tick % 2 === 0) estimateGender(active);

      } catch (e) { console.warn(e); }

      if (running) timer = setTimeout(loop, 300);
    }

    $('startBtn').onclick = async () => {
      $('startBtn').disabled = true;
      status('Starting…', 'running');
      try {
        await loadModels();
        if (!(await startCam())) { $('startBtn').disabled = false; return; }
        tracker.reset();
        updateUI();
        running = true;
        $('stopBtn').disabled = false;
        $('switchBtn').disabled = false;
        $('startBtn').textContent = 'Running…';
        status('Counting people + gender…', 'running');
        loop();
      } catch (e) {
        console.error(e);
        status('Model load failed — need internet first time', 'error');
        $('startBtn').disabled = false;
      }
    };

    $('stopBtn').onclick = () => {
      running = false;
      if (timer) clearTimeout(timer);
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      $('final-total').textContent = tracker.unique;
      $('final-men').textContent = tracker.men;
      $('final-women').textContent = tracker.women;
      $('final-unknown').textContent = tracker.unknown;
      $('result').classList.add('visible');
      status('Stopped', '');
      $('startBtn').disabled = true;
      $('stopBtn').disabled = true;
      $('switchBtn').disabled = true;
    };

    $('switchBtn').onclick = async () => {
      if (!running) return;
      preferEnv = !preferEnv;
      running = false;
      if (timer) clearTimeout(timer);
      status('Switching camera…', 'running');
      if (await startCam()) {
        running = true;
        status('Counting…', 'running');
        loop();
      }
    };

    $('resetBtn').onclick = () => {
      $('result').classList.remove('visible');
      tracker.reset();
      updateUI();
      $('startBtn').disabled = false;
      $('startBtn').textContent = 'Start Camera';
      $('stopBtn').disabled = true;
      $('switchBtn').disabled = true;
      status('Ready — tap Start', 'ready');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    if (!navigator.mediaDevices?.getUserMedia) {
      status('Camera not supported', 'error');
      $('startBtn').disabled = true;
    }
  </script>
</body>
</html>
