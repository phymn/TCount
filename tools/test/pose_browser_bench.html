<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RTMPose browser bench (LOCAL / uncleared weights)</title></head>
<body>
<pre id="out">loading…</pre>
<script src="../../crowd/vendor/ort.webgpu.min.js"></script>
<script src="../../crowd/rtmpose.js"></script>
<script>
(async () => {
  const log = (...a) => { const el = document.getElementById('out'); el.textContent += a.join(' ') + '\n'; console.log(...a); };
  try {
    const base = new URL('../../crowd/', location.href).href;
    ort.env.wasm.wasmPaths = {
      mjs: base + 'vendor/ort-wasm-simd-threaded.asyncify.js',
      wasm: base + 'vendor/ort-wasm-simd-threaded.asyncify.wasm'
    };
    ort.env.wasm.numThreads = 1;
    ort.env.logLevel = 'error';
    globalThis.__ortMaxPages = 1024 * 16;
    const url = '../../crowd/models/rtmpose_t_body7_256x192.onnx';
    const t0 = performance.now();
    const buf = await fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url); return r.arrayBuffer(); });
    log('KIND: REAL_MODEL (local uncleared Body7 ONNX — not shipped)');
    log('bytes', buf.byteLength, 'fetch_ms', (performance.now() - t0).toFixed(1));
    const session = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
    const warm = new ort.Tensor('float32', new Float32Array(3 * 256 * 192), [1, 3, 256, 192]);
    await session.run({ input: warm });
    const times = [];
    for (let i = 0; i < 15; i++) {
      const t1 = performance.now();
      await session.run({ input: warm });
      times.push(performance.now() - t1);
    }
    times.sort((a, b) => a - b);
    const med = times[Math.floor(times.length / 2)];
    log('wasm_median_ms', med.toFixed(2), 'p90_ms', times[Math.floor(times.length * 0.9)].toFixed(2));
    // structure unit checks in browser
    const RT = self.TCountRTMPose;
    const kpts = new Float32Array(34).fill(-1), scores = new Float32Array(17);
    for (const i of [9, 10]) { kpts[i * 2] = 5; kpts[i * 2 + 1] = 5; scores[i] = 0.9; }
    const hand = RT.acceptBodyStructure(kpts, scores, [0, 0, 20, 20]);
    log('hand_reject', JSON.stringify(hand));
    window.__POSE_BENCH__ = { med, times, hand, bytes: buf.byteLength };
  } catch (e) {
    log('ERROR', e && (e.message || e));
    window.__POSE_BENCH__ = { error: String(e && e.message || e) };
  }
})();
</script>
</body></html>
